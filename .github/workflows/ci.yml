name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,dev]"
      # Warnings are failures. An unclosed file is a leak on Linux and a LOCK
      # on Windows, where it can stop a later step -- or SCAPS -- writing it.
      - name: test
        run: pytest -W error -q
      - name: cli smoke test
        run: |
          scapsml --version
          scapsml params
          scapsml check examples/batio3xsx/project.xlsx
